---
layout: default
---
<article class="page-article publications-page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  <div class="pub-legend">
    <span class="pub-type-badge badge-w">W</span> Working Paper
    &ensp;
    <span class="pub-type-badge badge-j">J</span> Journal Article
    &ensp;
    <span class="pub-type-badge badge-r">R</span> Report / Brief
  </div>
  <div class="page-content">
    {{ content }}
  </div>
</article>
