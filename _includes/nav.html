<nav class="site-nav" role="navigation" aria-label="Main navigation">
  <div class="container nav-inner">
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul id="nav-menu" class="nav-links">
      {% for item in site.data.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url or page.url contains item.url and item.url != '/' %}class="nav-active" aria-current="page"{% elsif page.url == '/' and item.url == '/' %}class="nav-active" aria-current="page"{% endif %}>
            {{ item.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</nav>
