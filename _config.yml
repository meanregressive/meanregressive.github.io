title: "Deboleena Rakshit"
tagline: "Senior Research Analyst, IFPRI"
description: >-
  Development researcher with 7 years' experience in conducting rigorous
  evaluations across sub-Saharan Africa and South Asia, having worked
  previously on implementing development projects at scale.
url: "https://meanregressive.github.io"
baseurl: ""

author:
  name: "Deboleena Rakshit"
  first_name: "Deboleena"
  last_name: "Rakshit"
  location: "Mexico City and Washington, DC"
  github: "meanregressive"
  twitter: "meanregressive"
  bluesky: "meanregressive.bsky.social"
  linkedin: "deboleenarakshit"
  scholar: "cZbkgvgAAAAJ"
  orcid: "0009-0008-4674-5274"

theme: null
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

paginate: 8
paginate_path: "/blog/page:num/"

permalink: /blog/:year/:slug/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Deboleena Rakshit"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.bak
  - README.md
  - "*.tex"
  - "*.log"
  - vendor/
  - .bundle/
  - node_modules/
  - "C:/Users/**"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

sass:
  style: compressed
  sass_dir: _sass
